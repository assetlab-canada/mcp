name = "assetlab-mcp"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[routes]]
pattern = "mcp.assetlab.ca"
custom_domain = true

[vars]
ASSETLAB_API_URL = "https://ksirnjovowpvamgcnapt.supabase.co/functions/v1/api-gateway"
# OAUTH_SECRET — set via `wrangler secret put OAUTH_SECRET` (never commit this value)

[[kv_namespaces]]
binding = "OAUTH_CLIENTS"
id = "0f758e4fe838435d914752c6800eaf2b"

# Rate limiting (Workers Rate Limiting binding, enforced per edge location). Bounds what a
# single caller or a flood can cost in KV writes and api-gateway invocations. Namespace IDs
# are account-wide; pick unused ones if another Worker adds limiters.
# Every route except CORS preflight and favicons, keyed by client IP.
[[ratelimits]]
name = "REQUEST_LIMITER"
namespace_id = "1001"
simple = { limit = 1200, period = 60 }

# POST /oauth/register is unauthenticated and writes a permanent KV record per call.
[[ratelimits]]
name = "REGISTER_IP_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "REGISTER_GLOBAL_LIMITER"
namespace_id = "1003"
simple = { limit = 60, period = 60 }
